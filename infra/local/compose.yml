name: wolly-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wolly
      POSTGRES_USER: wolly
      POSTGRES_PASSWORD: ${WOLLY_POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolly -d wolly"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
