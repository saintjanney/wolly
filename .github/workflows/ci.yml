name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck shared schema
        run: npx tsc --noEmit -p packages/schema/tsconfig.json
      - name: Lint
        run: npm run lint
      # Includes the adversarial tests for the post renderer. That renderer's
      # output is injected with dangerouslySetInnerHTML on an origin shared by
      # every publication, so treat a failure here as a security regression
      # rather than a flaky test.
      - name: Test
        run: npm run test
      - name: Build web apps
        run: npm run build

  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/reader
        run: flutter pub get
      - name: Analyze
        working-directory: apps/reader
        run: flutter analyze --no-fatal-infos
