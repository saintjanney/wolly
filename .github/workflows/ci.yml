name: Rebuild CI
on:
  pull_request:
  push:
    branches: [main, develop, Go-Rebuild]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l backend/go)"
      - name: Test and vet
        working-directory: backend/go
        run: |
          go test -race ./...
          go vet ./...
      - run: python3 scripts/check-boundaries.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run contracts:check
      - run: npm run test --workspace @wolly/api-client
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache: false
      - run: python3 scripts/smoke-workspace.py
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - working-directory: apps/reader
        run: |
          flutter pub get
          flutter analyze
          flutter test
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - run: npx puppeteer browsers install chrome
      - name: Install rendition validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl --fail --location --output /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
          printf '#!/bin/sh\nexec java -jar /tmp/epubcheck-5.3.0/epubcheck.jar "$@"\n' | sudo tee /usr/local/bin/epubcheck >/dev/null
          sudo chmod +x /usr/local/bin/epubcheck
      - run: npm run test --workspace @wolly/converter
