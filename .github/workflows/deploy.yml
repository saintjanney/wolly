name: Deploy

# Deploys every Wolly surface.
#   push to develop  -> MOCK environment  (web: Hosting preview channel "mock", Android: "qa" testers)
#   push to main     -> PROD environment  (web: Hosting live,                 Android: "production" testers)
#
# The reader is a mobile app only: it is distributed as an Android APK via App
# Distribution and has no web Hosting site. The web surfaces are creator-hub and backoffice.
#
# Required GitHub secret:
#   FIREBASE_SERVICE_ACCOUNT  – the full Firebase Admin SDK service-account JSON.
#     The service account needs these IAM roles on project wolly-1133d:
#       • Firebase Hosting Admin
#       • Firebase App Distribution Admin
#       • (and API access enabled for Firebase Management)
#
# Prerequisites in Firebase (one-time):
#   • Hosting sites matching the targets in .firebaserc
#     (wolly-creator-hub, wolly-backoffice) created and applied.
#   • App Distribution tester groups named "qa" and "production".

on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIREBASE_PROJECT: wolly-1133d
  ANDROID_APP_ID: "1:550264739666:android:8d14c44e68dc0795d8cc8b"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      hosting_channel: ${{ steps.env.outputs.hosting_channel }}
      distribution_group: ${{ steps.env.outputs.distribution_group }}
    steps:
      - id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod"           >> "$GITHUB_OUTPUT"
            echo "hosting_channel=live"        >> "$GITHUB_OUTPUT"
            echo "distribution_group=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=mock"            >> "$GITHUB_OUTPUT"
            echo "hosting_channel=mock"        >> "$GITHUB_OUTPUT"
            echo "distribution_group=qa"       >> "$GITHUB_OUTPUT"
          fi

  # ── Web surfaces: creator-hub + backoffice (Next.js static export) ──────────
  web:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The blog prerenders its homepage, /discover and /sitemap.xml at build
      # time, so unlike the other two surfaces its BUILD needs Firestore
      # credentials, not just its deploy. Written before `npm run build` for
      # that reason. (A transient failure degrades to an empty list rather than
      # breaking the build; see apps/blog/src/lib/blog-data.ts.)
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      # Turbo builds every JS workspace that defines a build task
      # (creator-hub + backoffice -> apps/*/out, blog -> apps/blog/.next).
      - run: npm run build
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      # Security rules and indexes.
      #
      # These were NOT deployed by this workflow until the press shipped, which
      # meant packages/firebase-config was documentation rather than
      # configuration: a rules change only reached production if someone
      # remembered to run firebase deploy by hand. The press made that concrete
      # (its storage rule is what permits .md and .txt manuscripts, and its
      # Firestore rule is what stops an author clearing their own takedown), but
      # the gap applied to every rule in the file.
      #
      # Deployed BEFORE the surfaces that depend on them, so a rule a new client
      # needs is never the last thing to arrive.
      #
      # A failure here is FATAL on purpose. Rules are the only thing standing
      # between a client and the database, so shipping a surface whose rules did
      # not deploy is worse than not shipping at all.
      #
      # The deploy service account needs both of these; firebase-tools hits them
      # in sequence, so granting only the first moves the error rather than
      # fixing it:
      #
      #   roles/firebasestorage.admin   resolve the default bucket
      #   roles/firebaserules.admin     compile and publish the rules
      #
      # Verify the live ruleset independently with
      # `npm --workspace @wolly/firebase-config run test:rules`.
      - name: Deploy security rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT" --non-interactive

      - name: Deploy creator-hub + backoffice
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          if [ "${{ needs.config.outputs.hosting_channel }}" = "live" ]; then
            npx firebase-tools deploy \
              --only hosting:creator-hub,hosting:backoffice \
              --project "$FIREBASE_PROJECT" --non-interactive
          else
            npx firebase-tools hosting:channel:deploy "${{ needs.config.outputs.hosting_channel }}" \
              --only creator-hub,backoffice \
              --project "$FIREBASE_PROJECT" --expires 30d --non-interactive
          fi

      # ── Blog: SSR on Cloud Run ──────────────────────────────────────────────
      #
      # NOT firebase-tools' `webframeworks` backend. That path synthesises its
      # own package.json for a Cloud Function and runs `npm ci` against the
      # monorepo lockfile at deploy time, which cannot stay in sync in an npm
      # workspaces repo, and it is untested past Next 15.0 while we are pinned
      # to 15.5.21 for CVE-2025-66478.
      #
      # Instead `next build` emits `output: 'standalone'` (already done by the
      # build step above), which traces the exact files needed and writes a
      # minimal node_modules. The Dockerfile copies that and runs it, installing
      # nothing. Hosting then rewrites all traffic to the Cloud Run service.
      #
      # Note: this deploys the blog to its LIVE site even from `develop`, unlike
      # creator-hub and backoffice which go to a preview channel. There is
      # currently one blog environment, not two.
      - name: Authenticate gcloud
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          gcloud config set project "$FIREBASE_PROJECT"

      - name: Deploy blog to Cloud Run
        working-directory: apps/blog
        run: |
          gcloud run deploy wolly-blog \
            --source . \
            --region europe-west2 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --project "$FIREBASE_PROJECT" \
            --quiet

      - name: Point the blog hosting site at Cloud Run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools deploy \
            --only hosting:blog \
            --project "$FIREBASE_PROJECT" --non-interactive

      # Scoped to the three codebases this repo owns.
      #
      # `converter` is the manuscript press; it bundles @sparticuz/chromium and
      # so is a large, slow deploy. `payments` holds Paystack checkout and was
      # previously excluded because its secret lived only in a deploy-time .env,
      # which meant CI could not deploy it without breaking live checkout. The
      # secret is now in Secret Manager and bound with runWith({ secrets }), and
      # services/payments/predeploy-guard.sh refuses the deploy if it is not
      # resolvable, so the failure is loud and happens here rather than at a
      # reader's checkout.
      #
      # Keep the scope anyway. An unscoped `firebase deploy --only functions`
      # treats anything it does not find locally as removed, and this project has
      # carried unlabelled functions before. Omitting --force means such a deploy
      # fails rather than deletes, but that is a backstop, not a plan.
      #
      # Retried, because this project sits close to the Cloud Run CPU quota for
      # europe-west2. Every 2nd-gen function is a Cloud Run service (11 of them
      # now that the press is one), and a deploy briefly runs each new revision
      # alongside the old one it replaces, so peak demand is roughly double the
      # steady state. When it tips over, a healthy function fails to come up with
      # "Quota exceeded for total allowable CPU per project per region" and the
      # deploy reports an error for a function whose code is fine.
      #
      # This is a race, not a wall: retiring revisions release CPU within a
      # minute, and a second attempt has succeeded every time. Cloud Run keeps
      # serving the last good revision throughout, so a failure here degrades to
      # "not updated", never to an outage.
      #
      # The real fix is a quota increase for Cloud Run CPU in europe-west2. Ask
      # for one and drop the retry to a single attempt.
      - name: Deploy server functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          for attempt in 1 2 3; do
            if npx firebase-tools deploy \
                 --only functions:api,functions:converter,functions:payments \
                 --project "$FIREBASE_PROJECT" --non-interactive; then
              echo "functions deployed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::functions deploy attempt $attempt failed; retrying in 90s"
              sleep 90
            fi
          done
          echo "::error::functions deploy failed after 3 attempts"
          exit 1

  # ── Mobile + reader web: Flutter ────────────────────────────────────────────
  reader:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14

      # PINNED, not `channel: stable`.
      #
      # Tracking stable unpinned meant Flutter's toolchain floors moved without
      # any change on our side, and each one only surfaced after the previous was
      # cleared: Gradle 8.9 -> 8.14, then AGP 8.7 -> 8.11.1, then Kotlin 2.1 ->
      # 2.2.20, and finally a transitive flutter_html that does not compile on the
      # newer Dart SDK. None of it was reproducible locally, because a developer's
      # Flutter is whatever they installed.
      #
      # Pinning makes CI match a version the change was actually verified against,
      # and turns Flutter upgrades into a deliberate commit that can be tested,
      # rather than an ambush on an unrelated deploy.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/reader
        run: flutter pub get

      - name: Build Android APK
        working-directory: apps/reader
        run: flutter build apk --release

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Distribute Android APK to testers
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase appdistribution:distribute \
            apps/reader/build/app/outputs/flutter-apk/app-release.apk \
            --app "$ANDROID_APP_ID" \
            --groups "${{ needs.config.outputs.distribution_group }}" \
            --release-notes "${{ needs.config.outputs.environment }} build ${{ github.sha }}" \
            --project "$FIREBASE_PROJECT"
